server {
    listen 80;
    listen [::]:80;
    server_name itadbeer.com;
    set $itadbeer_https_redirect 1;
    # ArvanCloud may terminate HTTPS and forward to the origin over HTTP.
    if ($http_x_forwarded_proto = https) { set $itadbeer_https_redirect 0; }
    include /etc/nginx/snippets/itadbeer-static.conf;
}
server {
    listen 80;
    listen [::]:80;
    server_name www.itadbeer.com;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/itadbeer/acme;
        try_files $uri =404;
    }
    location / { return 301 https://itadbeer.com$request_uri; }
}
