# Preserve the origin's current default TLS certificate only while obtaining
# Itadbeer's own certificate behind ArvanCloud's forced-HTTPS routing.
include /etc/nginx/itadbeer-http.conf;
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name itadbeer.com www.itadbeer.com;
    ssl_certificate /etc/letsencrypt/live/adhkar.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adhkar.ir/privkey.pem;
    set $itadbeer_https_redirect 0;
    include /etc/nginx/snippets/itadbeer-static.conf;
}
