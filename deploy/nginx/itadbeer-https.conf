include /etc/nginx/itadbeer-http.conf;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name itadbeer.com;
    ssl_certificate /etc/letsencrypt/live/itadbeer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itadbeer.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $itadbeer_https_redirect 0;
    include /etc/nginx/snippets/itadbeer-static.conf;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.itadbeer.com;
    ssl_certificate /etc/letsencrypt/live/itadbeer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itadbeer.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://itadbeer.com$request_uri;
}
