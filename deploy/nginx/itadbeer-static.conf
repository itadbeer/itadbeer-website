root /srv/itadbeer/current;
index index.html;
charset utf-8;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/css application/javascript application/json image/svg+xml application/xml;

location ^~ /.well-known/acme-challenge/ {
    root /srv/itadbeer/acme;
    try_files $uri =404;
}
location = /fa/ { return 308 https://itadbeer.com/fa; }
location = /release.json {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}
location ~ /\. { deny all; }
location ~ \.rsc$ { return 404; }
location ~* \.(woff2|webp|png|svg)$ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
}
location / {
    if ($itadbeer_https_redirect = 1) { return 301 https://itadbeer.com$request_uri; }
    add_header Cache-Control "no-store" always;
    try_files $uri $uri.html $uri/ =404;
}
error_page 404 /404.html;
location = /404.html {
    internal;
    add_header Cache-Control "no-store" always;
}
